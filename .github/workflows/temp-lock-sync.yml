name: Temporary Stage B lock sync

on:
  pull_request:
    branches: [dev/architecture-contracts]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'dev/domain-db-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/domain-db-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync database dependency lockfile"
          git push origin dev/domain-db-foundation
