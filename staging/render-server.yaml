# NOT APPLIED: creates paid resources. CEO cost approval required first.
# Keep root render.yaml and the existing static demo unchanged.
services:
  - type: web
    runtime: node
    name: yunela-server-staging
    repo: https://github.com/sjastellar-eng/Yunela-site
    branch: fix/task-16-server-staging
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /
    disk:
      name: yunela-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: staging
      - key: HOST
        value: 0.0.0.0
      - key: VITE_STATIC_DEMO
        value: '0'
      - key: YUNELA_STAGE_MODE
        value: '1'
      - key: YUNELA_SYNTHETIC_ONLY
        value: '1'
      - key: YUNELA_TEST_FIXTURES
        value: '1'
      - key: YUNELA_WEIGHT_FIXTURES
        value: '1'
      - key: YUNELA_LEGACY_FIXED_SKU_TESTS
        value: '0'
      - key: YUNELA_DB_FILE
        value: /var/data/yunela.sqlite
      - key: YUNELA_AUTH_SECRET
        generateValue: true
      - key: YUNELA_STAGE_PASSWORD
        generateValue: true
      - key: YUNELA_OPERATOR_EMAIL
        value: operator@example.test
      - key: YUNELA_OPERATOR_PASSWORD
        generateValue: true
