services:
  - type: web
    runtime: static
    name: yunela-demo
    repo: https://github.com/sjastellar-eng/Yunela-site
    branch: feat/render-static-demo
    autoDeployTrigger: 'off'
    buildCommand: npm ci --ignore-scripts --include=dev && npx vite build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VITE_STATIC_DEMO
        value: '1'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
